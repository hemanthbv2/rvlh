<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RV Learning Hub — Admissions & Academic AI Chatbot</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- RVLH Chatbot Stylesheet -->
  <link rel="stylesheet" href="rvlh-chatbot.css?v=2.6">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body data-nobg="true" data-auto-open="true">

  <!-- Core RVLH Chatbot Scripts -->
  <script>
    // Global flag for instant auto-open
    window.AUTO_OPEN_CHATBOT = true;

    // Configuration Mock for Local & Live Testing
    window.RVLH_CONFIG = {
      wpRestUrl: 'https://rvlearninghub.com/wp-json/rvlh-chatbot/v1',
      vercelUrl: 'https://chatbot-dashboard.vercel.app',
      apiKey: 'rvlh_demo_key_12345',
      instituteId: 'rvlh'
    };
  </script>

  <script src="rvlh-knowledge-base.js?v=2.6"></script>
  <script src="telemetry.js?v=2.6"></script>
  <script src="rvlh-engine.js?v=2.6"></script>
  <script src="rvlh-chatbot.js?v=2.6"></script>

  <script>
    // Ensure instant auto-open of RVLH chatbot window
    (function ensureAutoOpen() {
      const openWindow = () => {
        const win = document.getElementById('rvlh-chat-window');
        const badge = document.getElementById('rvlh-fab-badge');
        const fabIcon = document.getElementById('rvlh-fab-icon');
        const inp = document.getElementById('rvlh-input-field');

        if (win) {
          document.body.classList.add('rvlh-chat-open');
          win.classList.add('open');
          if (badge) badge.style.display = 'none';
          if (fabIcon) {
            fabIcon.innerHTML = '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
          }
          if (inp) {
            try { inp.focus(); } catch (e) {}
          }
          return true;
        }
        return false;
      };

      // Attempt immediately and with fallback interval
      if (!openWindow()) {
        const timer = setInterval(() => {
          if (openWindow()) clearInterval(timer);
        }, 30);
        setTimeout(() => clearInterval(timer), 3000);
      }
    })();
  </script>
</body>
</html>
